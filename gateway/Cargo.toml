[package]
name = "ds41-gateway"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "DeepSeek API parity gateway in front of TensorFold's token-in/token-out route."

[[bin]]
name = "ds41-paridad"
path = "src/bin/ds41-paridad.rs"

[dependencies]
deepseek-recipe = "=0.2.0"
deepseek-recipe-core = "=0.2.0"
deepseek-recipe-encoding = "=0.2.0"
deepseek-recipe-image = { version = "=0.2.0", default-features = false, features = ["reqwest-fetch"] }
tokenizers = "0.23"
axum = "0.8"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
sha2 = "0.10"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
subtle = "2.6"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
pin-project-lite = "0.2"

[dev-dependencies]
quick-xml = "0.37"

[profile.release]
lto = "thin"
codegen-units = 1
